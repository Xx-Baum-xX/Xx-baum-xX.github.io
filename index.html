<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baum_ | 3D Printing & Maker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #080a0e;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 15%, rgba(249, 115, 22, 0.12) 0%, transparent 45%),
                              radial-gradient(circle at 50% 85%, rgba(34, 197, 94, 0.08) 0%, transparent 45%);
        }
        .container {
            width: 100%;
            max-width: 460px;
            text-align: center;
            background: rgba(18, 22, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 42px 30px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(249, 115, 22, 0.1);
        }
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 22px;
        }
        .avatar-glow {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #22c55e, #ea580c);
            filter: blur(10px);
            opacity: 0.6;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.75; transform: scale(1.02); }
        }
        .avatar {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.15);
            display: block;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 35%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.bio {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 34px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 31, 42, 0.85);
            color: #f3f4f6;
            padding: 18px 22px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .link-btn svg {
            width: 24px;
            height: 24px;
            fill: #9ca3af;
            transition: fill 0.25s ease, transform 0.25s ease;
            flex-shrink: 0;
        }
        .link-btn:hover {
            background: rgba(35, 42, 58, 0.95);
            border-color: rgba(249, 115, 22, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.2);
        }
        .link-btn:hover svg {
            fill: #f97316;
            transform: scale(1.1);
        }
        .arrow {
            color: #6b7280;
            font-size: 18px;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        .link-btn:hover .arrow {
            transform: translateX(5px);
            color: #f97316;
        }
        .footer {
            margin-top: 38px;
            font-size: 13px;
            color: #6b7280;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
    </style>
</head>
