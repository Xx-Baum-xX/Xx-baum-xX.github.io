<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baum_ | 3D Printing & Maker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0d10;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.06) 0%, transparent 50%);
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: rgba(20, 24, 33, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 28px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(249, 115, 22, 0.08);
        }
        .avatar-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
        }
        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(249, 115, 22, 0.6);
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4), 0 0 50px rgba(34, 197, 94, 0.15);
        }
        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.bio {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 32px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 29, 36, 0.85);
            color: #f3f4f6;
            padding: 18px 22px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .link-btn svg {
            width: 24px;
            height: 24px;
            fill: #9ca3af;
            transition: fill 0.25s ease;
            flex-shrink: 0;
        }
        .link-btn:hover {
            background: rgba(35, 40, 52, 0.95);
            border-color: rgba(249, 115, 22, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.2);
        }
        .link-btn:hover svg {
            fill: #f97316;
        }
        .arrow {
            color: #6b7280;
            font-size: 18px;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .link-btn:hover .arrow {
            transform: translateX(4px);
            color: #f97316;
        }
        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: #6b7280;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-wrapper">
            <!-- Wichtig: Das Bild vorher in "avatar.png" umbenennen! -->
            <img src="avatar.png" alt="Baum_ Avatar" class="avatar">
        </div>
        <h1>Baum_</h1>
        <p class="bio">Functional prints, useful gadgets, cool fidgets, beautiful decorations and way more. Let's connect! ⚡</p>

        </div>

        <div class="footer">
            Designed by Baum_
        </div>
    </div>

</body>
</html>
